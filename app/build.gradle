apply plugin: 'com.android.application'

android {
    namespace 'com.example.diverscan.activeid'
    compileSdkVersion 34

    signingConfigs {
        release {
            storeFile file("C:/Users/Virtu/OneDrive/Documents/GitHub/SC-Projects/Assets/AssetKey.jks")
            storePassword "Smartcosta2025"
            keyAlias "Key0"
            keyPassword "Smartcosta2025"
        }
    }

    defaultConfig {
        applicationId "com.example.diverscan.activeid"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // URL Base por defecto (Ambiente de Pruebas)
        // buildConfigField "String", "BASE_URL", "\"http://3.85.211.90:70/ApiHH/Api\""
        buildConfigField "String", "BASE_URL", "\"http://192.168.1.110:5200/api\""
    }
    buildTypes {
        release {
            // signingConfig signingConfigs.release // Comentado temporalmente por falta de keystore
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // URL Base para Producción
            buildConfigField "String", "BASE_URL", "\"http://srvapppro/ApiHH/api\""
        }
        debug {
            // URL Base para Debug (Ambiente de Pruebas)
            // buildConfigField "String", "BASE_URL", "\"http://100.31.144.26:70/ApiHH/\""
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.110:5200/api\""
        }
        local {
            initWith debug
            // URL Base para Local (IP actual de la máquina)
            buildConfigField "String", "BASE_URL", "\"http://192.168.1.110:5200/api\""
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // --- AndroidX modern replacements ---
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.core:core-splashscreen:1.0.1"

    // --- Lifecycle (ViewModel y LiveData) ---
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'

    // --- Networking ---
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.android.volley:volley:1.2.1'

    // -- Custom --

    // --- Projects locales ---
    implementation project(path: ':RFIDAPI3Library')
    implementation project(path: ':BarcodeScannerLibrary')

    // --- Testing ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
